# docs/ANDROID.md. With the three signing secrets set (ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS), each push to main builds a
# signed APK and publishes it as a GitHub Release (tag build-<run number>);
# Obtainium on the phone installs the newest. Without them the build is the
# debug APK, uploaded as the run artifact `ksg-debug-apk`, and nothing is
# released. A push to another listed branch builds the same way and never
# releases.
name: Android APK

on:
  push:
    branches: [main, apk-releases, mobile-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # 'true' only when all three secrets are set. A step cannot test a secret
      # directly, so the job's env carries the answer.
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      # The game, as `npm run build` makes it but without the type check. The
      # licensed art is gitignored, so this build has none of it.
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android

      # JDK 21: the Capacitor modules compile at Java 21 (capacitor.build.gradle),
      # so 17 fails the build.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the APK
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: build-${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/frontier-idle-${{ github.run_number }}.apk"

      - name: Release
        if: env.SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" "frontier-idle-${{ github.run_number }}.apk" \
            --target "$GITHUB_SHA" --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --format='%h %s')"
          # Keep the newest 10 releases; Obtainium only needs the latest.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

      - name: Artifact
        if: env.SIGNED == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontier-idle-${{ github.run_number }}
          path: frontier-idle-${{ github.run_number }}.apk

      # No signing secrets: a debug APK. Gradle signs it with the runner's own
      # debug key, which is new every run, so a phone cannot install one debug
      # build over another (docs/ANDROID.md, "The debug build").
      - name: Build the debug APK
        if: env.SIGNED != 'true'
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: debug-${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/frontier-idle-debug-${{ github.run_number }}.apk"

      - name: Debug artifact
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ksg-debug-apk
          path: frontier-idle-debug-${{ github.run_number }}.apk
          if-no-files-found: error
