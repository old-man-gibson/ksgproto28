<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tile map preview</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 12px monospace; }
      #bar { padding: 6px; position: sticky; top: 0; background: #222; }
      canvas { image-rendering: pixelated; display: block; }
      #wrap { position: relative; display: inline-block; }
      #grid { position: absolute; left: 0; top: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bar">?map=holding_level (any *.map.json basename) &amp;scale=0.5 &amp;grid=10 — hover for tile coords: <span id="pos"></span></div>
    <div id="wrap"><canvas id="c"></canvas><canvas id="grid"></canvas></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
